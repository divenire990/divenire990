<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a1e" />
      <stop offset="45%" stop-color="#0c1333" />
      <stop offset="100%" stop-color="#141a45" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e295d" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="nebula-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0c1333" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebula-indigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#4338ca" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0c1333" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="text-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="text-sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="ring-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="ring-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="line-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="line-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Pattern Dots -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 56px;
      font-weight: 800;
      letter-spacing: 3.5px;
      fill: url(#text-title-grad);
      text-anchor: middle;
    }
    .sub-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 17px;
      font-weight: 450;
      letter-spacing: 1.2px;
      fill: url(#text-sub-grad);
      text-anchor: middle;
    }
    .node-line {
      stroke-linecap: round;
    }
  </style>

  <!-- Background Base -->
  <rect width="920" height="260" rx="18" fill="url(#bg-grad)" />
  <rect width="920" height="260" rx="18" fill="url(#dot-grid)" />
  <rect width="918" height="258" x="1" y="1" rx="17" fill="none" stroke="url(#border-grad)" stroke-width="1.2" />

  <!-- Ambient Light Nebulae with Breathing Animation -->
  <circle cx="690" cy="130" r="160" fill="url(#nebula-cyan)">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="7s" repeatCount="indefinite" />
    <animate attributeName="r" values="150;175;150" dur="9s" repeatCount="indefinite" />
  </circle>

  <circle cx="750" cy="125" r="170" fill="url(#nebula-indigo)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="8s" repeatCount="indefinite" />
    <animate attributeName="r" values="160;185;160" dur="11s" repeatCount="indefinite" />
  </circle>

  <circle cx="160" cy="90" r="110" fill="url(#nebula-indigo)" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== RIGHT SIDE: ORBITS, NODES & CONNECTOR NETWORK ==================== -->
  
  <!-- Orbit System Group (Center around 700, 130) -->
  <g transform="translate(705, 130)">
    
    <!-- Orbit Ring 1 (Major Inclined Ellipse) -->
    <ellipse cx="0" cy="0" rx="145" ry="58" transform="rotate(-22)" fill="none" stroke="url(#ring-grad-1)" stroke-width="1.6" stroke-dasharray="8 6" filter="url(#glow-subtle)">
      <animate attributeName="stroke-dashoffset" values="0;120" dur="24s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.55;0.85;0.55" dur="6s" repeatCount="indefinite" />
    </ellipse>

    <!-- Orbit Ring 2 (Secondary Inclined Ellipse) -->
    <ellipse cx="0" cy="0" rx="108" ry="42" transform="rotate(38)" fill="none" stroke="url(#ring-grad-2)" stroke-width="1.4" stroke-dasharray="5 7">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="18s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.4;0.75;0.4" dur="5s" repeatCount="indefinite" />
    </ellipse>

    <!-- Orbit Ring 3 (Outer Subtle Guide Ring) -->
    <ellipse cx="0" cy="0" rx="175" ry="72" transform="rotate(-8)" fill="none" stroke="#6366f1" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 9">
      <animate attributeName="stroke-dashoffset" values="0;-80" dur="30s" repeatCount="indefinite" />
    </ellipse>

    <!-- Revolving Satellite Particle 1 on Ring 1 -->
    <g transform="rotate(-22)">
      <g>
        <circle cx="145" cy="0" r="3.2" fill="#38bdf8" filter="url(#glow-strong)">
          <animate attributeName="r" values="2.6;4;2.6" dur="3s" repeatCount="indefinite" />
        </circle>
        <circle cx="145" cy="0" r="1.5" fill="#ffffff" />
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite" />
      </g>
    </g>

    <!-- Revolving Satellite Particle 2 on Ring 2 (Reverse Orbit) -->
    <g transform="rotate(38)">
      <g>
        <circle cx="-108" cy="0" r="2.8" fill="#818cf8" filter="url(#glow-strong)">
          <animate attributeName="r" values="2.2;3.6;2.2" dur="2.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="-108" cy="0" r="1.2" fill="#ffffff" />
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite" />
      </g>
    </g>

    <!-- Revolving Satellite Particle 3 (Trailing Spark) -->
    <g transform="rotate(-8)">
      <g>
        <circle cx="175" cy="0" r="2" fill="#06b6d4" opacity="0.8">
          <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite" />
        </circle>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite" />
      </g>
    </g>
  </g>

  <!-- Gently Shifting Connector Lines -->
  <g class="node-line">
    <!-- Connector 1: 520,135 -> 585,85 -->
    <line x1="520" y1="135" x2="585" y2="85" stroke="url(#line-grad-1)" stroke-width="1.3" stroke-dasharray="3 5">
      <animate attributeName="stroke-opacity" values="0.25;0.75;0.25" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="stroke-dashoffset" values="0;40" dur="12s" repeatCount="indefinite" />
    </line>

    <!-- Connector 2: 585,85 -> 670,60 -->
    <line x1="585" y1="85" x2="670" y2="60" stroke="url(#line-grad-2)" stroke-width="1.4">
      <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="5.5s" repeatCount="indefinite" />
    </line>

    <!-- Connector 3: 670,60 -> 765,80 -->
    <line x1="670" y1="60" x2="765" y2="80" stroke="url(#line-grad-1)" stroke-width="1.2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="32;0" dur="10s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="3.8s" repeatCount="indefinite" />
    </line>

    <!-- Connector 4: 765,80 -> 840,125 -->
    <line x1="765" y1="80" x2="840" y2="125" stroke="url(#line-grad-2)" stroke-width="1.3">
      <animate attributeName="stroke-opacity" values="0.35;0.85;0.35" dur="4.6s" repeatCount="indefinite" />
    </line>

    <!-- Connector 5: 840,125 -> 805,190 -->
    <line x1="840" y1="125" x2="805" y2="190" stroke="url(#line-grad-1)" stroke-width="1.2" stroke-dasharray="5 3">
      <animate attributeName="stroke-dashoffset" values="0;50" dur="14s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.2;0.65;0.2" dur="5.1s" repeatCount="indefinite" />
    </line>

    <!-- Connector 6: 805,190 -> 705,130 (Core) -->
    <line x1="805" y1="190" x2="705" y2="130" stroke="url(#line-grad-2)" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="4.0s" repeatCount="indefinite" />
    </line>

    <!-- Connector 7: 705,130 -> 615,185 -->
    <line x1="705" y1="130" x2="615" y2="185" stroke="url(#line-grad-1)" stroke-width="1.4" stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="11s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.35;0.8;0.35" dur="4.8s" repeatCount="indefinite" />
    </line>

    <!-- Connector 8: 615,185 -> 520,135 -->
    <line x1="615" y1="185" x2="520" y2="135" stroke="url(#line-grad-2)" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="6.0s" repeatCount="indefinite" />
    </line>

    <!-- Cross Connector: 585,85 -> 705,130 -->
    <line x1="585" y1="85" x2="705" y2="130" stroke="url(#line-grad-1)" stroke-width="1.1" stroke-dasharray="2 6">
      <animate attributeName="stroke-dashoffset" values="0;60" dur="15s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.15;0.55;0.15" dur="3.5s" repeatCount="indefinite" />
    </line>

    <!-- Cross Connector: 705,130 -> 765,80 -->
    <line x1="705" y1="130" x2="765" y2="80" stroke="url(#line-grad-2)" stroke-width="1.1" stroke-dasharray="3 5">
      <animate attributeName="stroke-dashoffset" values="45;0" dur="13s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="4.3s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Animated Glowing Network Nodes -->
  <g>
    <!-- Central Core Node (705, 130) -->
    <g transform="translate(705, 130)">
      <!-- Outer Core Pulse -->
      <circle cx="0" cy="0" r="16" fill="url(#core-glow)" opacity="0.6">
        <animate attributeName="r" values="12;22;12" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite" />
      </circle>
      <!-- Middle Ring -->
      <circle cx="0" cy="0" r="7" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8">
        <animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite" />
      </circle>
      <!-- Solid Inner -->
      <circle cx="0" cy="0" r="4.2" fill="#ffffff" filter="url(#glow-strong)" />
    </g>

    <!-- Node 1: Left Frontier (520, 135) -->
    <g transform="translate(520, 135)">
      <circle cx="0" cy="0" r="8" fill="#38bdf8" opacity="0.25">
        <animate attributeName="r" values="6;11;6" dur="3.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="3" fill="#38bdf8" filter="url(#glow-subtle)">
        <animate attributeName="r" values="2.4;3.5;2.4" dur="3.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="1.4" fill="#ffffff" />
    </g>

    <!-- Node 2: Top Left (585, 85) -->
    <g transform="translate(585, 85)">
      <circle cx="0" cy="0" r="9" fill="#818cf8" opacity="0.2">
        <animate attributeName="r" values="7;12;7" dur="4.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.1;0.35;0.1" dur="4.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="3.2" fill="#818cf8" filter="url(#glow-subtle)">
        <animate attributeName="r" values="2.6;3.8;2.6" dur="4.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="1.3" fill="#ffffff" />
    </g>

    <!-- Node 3: Top Apex (670, 60) -->
    <g transform="translate(670, 60)">
      <circle cx="0" cy="0" r="7" fill="#06b6d4" opacity="0.25">
        <animate attributeName="r" values="5;10;5" dur="3.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="2.8" fill="#06b6d4" filter="url(#glow-subtle)" />
      <circle cx="0" cy="0" r="1.2" fill="#ffffff" />
    </g>

    <!-- Node 4: Top Right (765, 80) -->
    <g transform="translate(765, 80)">
      <circle cx="0" cy="0" r="10" fill="#6366f1" opacity="0.25">
        <animate attributeName="r" values="7;13;7" dur="4.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.15;0.45;0.15" dur="4.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="3.5" fill="#818cf8" filter="url(#glow-subtle)">
        <animate attributeName="r" values="2.8;4.2;2.8" dur="4.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
    </g>

    <!-- Node 5: Far Right Edge (840, 125) -->
    <g transform="translate(840, 125)">
      <circle cx="0" cy="0" r="8" fill="#38bdf8" opacity="0.2">
        <animate attributeName="r" values="6;11;6" dur="3.9s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="3" fill="#38bdf8" filter="url(#glow-subtle)" />
      <circle cx="0" cy="0" r="1.3" fill="#ffffff" />
    </g>

    <!-- Node 6: Bottom Right (805, 190) -->
    <g transform="translate(805, 190)">
      <circle cx="0" cy="0" r="9" fill="#818cf8" opacity="0.2">
        <animate attributeName="r" values="6;12;6" dur="5.1s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.1;0.4;0.1" dur="5.1s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="3.2" fill="#818cf8" filter="url(#glow-subtle)" />
      <circle cx="0" cy="0" r="1.3" fill="#ffffff" />
    </g>

    <!-- Node 7: Bottom Left (615, 185) -->
    <g transform="translate(615, 185)">
      <circle cx="0" cy="0" r="8" fill="#06b6d4" opacity="0.2">
        <animate attributeName="r" values="5;10;5" dur="3.7s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="3" fill="#38bdf8" filter="url(#glow-subtle)">
        <animate attributeName="r" values="2.4;3.6;2.4" dur="3.7s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="1.2" fill="#ffffff" />
    </g>
  </g>

  <!-- ==================== LEFT SIDE: TYPOGRAPHY & BRANDING ==================== -->
  
  <!-- Main Title: Zhihao Cai -->
  <g transform="translate(460, 118)">
    <text x="0" y="0" class="title-text" text-anchor="middle">Zhihao Cai</text>
  </g>

  <!-- Subtitle Line: 一个 AI 爱好者的实验角落 -->
  <g transform="translate(460, 166)">
    <text x="0" y="0" class="sub-text" text-anchor="middle">一个 AI 爱好者的实验角落</text>
  </g>

</svg>
